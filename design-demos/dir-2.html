<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向二 · Experimental Jetset — 白纸目录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#101012;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;
       background-image:radial-gradient(120% 80% at 80% 0%,#1a1a1e 0%,#101012 60%)}
  .host{position:relative;width:1180px;height:760px;border-radius:12px;background:#141416;
        box-shadow:0 40px 120px -40px #000,0 0 0 1px #ffffff0a;overflow:hidden}
  .host .bar{height:46px;border-bottom:1px solid #ffffff0a;display:flex;align-items:center;gap:9px;padding:0 18px;color:#8A8A92;font-size:12.5px}
  .host .dot{width:8px;height:8px;border-radius:50%;background:#2a2b31}
  .host .ghost{position:absolute;left:34px;top:120px;width:560px;font-size:13px;line-height:1.9;color:#3a3b41}
  .host .ghost .msg{background:#1b1c20;border-radius:10px;padding:12px 16px;width:fit-content;color:#54565e}

  /* ---------- 白纸目录 ---------- */
  .panel{position:absolute;right:22px;bottom:22px;width:430px;height:620px;background:#FAFAF7;color:#111;
         box-shadow:0 30px 80px -20px #000e,0 0 0 1px #ffffff1a;
         display:flex;flex-direction:column;overflow:hidden}
  .p-head{background:#111;color:#FAFAF7;padding:9px 12px 8px}
  .p-head .h1{display:flex;align-items:baseline;justify-content:space-between}
  .p-head .h1 b{font:900 15px/1 Inter;letter-spacing:-.02em}
  .p-head .h1 span{font:500 11px/1 "JetBrains Mono";letter-spacing:.06em;opacity:.72}
  .p-search{margin-top:8px;border:1px solid #FAFAF7;display:flex;align-items:center;gap:6px;padding:3px 6px}
  .p-search span{font:400 11px/1.3 Inter;color:#FAFAF7b0}
  .p-search .cur{width:1px;height:11px;background:#FAFAF7;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .p-body{flex:1;overflow:hidden}
  .p-grpbar{background:#111;color:#FAFAF7;padding:4px 10px;display:flex;justify-content:space-between;
            font:700 11px/1.4 Inter;letter-spacing:.02em}
  .p-row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;
         padding:5.5px 10px;border-bottom:1px solid #111;position:relative}
  .p-row:hover,.p-row.on{background:#111;color:#FAFAF7}
  .p-row:hover .p-main p,.p-row.on .p-main p{color:#FAFAF7a8}
  .p-row:hover .p-acts,.p-row.on .p-acts{opacity:1}
  .p-idx{font:500 11px/1 "JetBrains Mono";align-self:start;padding-top:3px;opacity:.75}
  .p-main{min-width:0}
  .p-main b{font-weight:800;font-size:12.5px;letter-spacing:-.025em;display:block;line-height:1.25}
  .p-main p{margin:1px 0 0;font-size:12px;line-height:1.25;color:#3B3B3B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:212px}
  .p-row:hover .p-main p{color:#FAFAF7a8}
  .p-acts{display:flex;gap:3px;visibility:hidden}
  .p-row:hover .p-acts,.p-row.on .p-acts{visibility:visible}
  .p-acts button{font:600 11px/1 Inter;letter-spacing:.04em;padding:3px 5px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
  .p-acts button.solid{background:#FAFAF7;color:#111;border-color:#FAFAF7}
  .p-foot{background:#111;color:#FAFAF7;padding:6px 10px;display:flex;gap:12px;font:500 11px/1.4 "JetBrains Mono";letter-spacing:.03em}
  .p-foot .sp{margin-left:auto;opacity:.7}
</style>
</head>
<body>
<div class="host">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span style="margin-left:8px">xhxnb-note — DeepSeek Harness</span></div>
<div class="panel">
    <div class="p-head">
      <div class="h1"><b>技能目录</b><span>19</span></div>
      <div class="p-search"><span style="color:#FAFAF780">搜索技能</span><i class="cur"></i></div>
    </div>
    <div class="p-body" id="list"></div>
    <div class="p-foot"><span>Enter 执行</span><span>Tab 插入</span><span>Space 预览</span><span class="sp">共 19 项</span></div>
  </div>
</div>

<script>
const DATA = [
  ['domain-modeling','Build and sharpen a project\u2019s domain model.','project'],
  ['grill-me','A relentless interview to sharpen a plan or design.','project'],
  ['grill-with-docs','An interview that also writes ADRs and a glossary.','project'],
  ['grilling','Grill the user relentlessly about a plan, decision, or idea.','project'],
  ['humanizer-yu','去除中文文本中的 AI 生成痕迹——西化句式、翻译腔。','project'],
  ['natural-chinese','让中文读起来像人写的：自然中文写作与改写。','project'],
  ['paper-humanizer','Academic text polisher and humanizer.','project'],
  ['tencent-channel-community','腾讯频道社区管理：频道、成员、帖子、评论。','project'],
  ['wechat-oa-style','采集公众号文章，产出证据化的文风总结。','project'],
  ['huashu-design','花叔Design——用 HTML 做高保真原型、幻灯片、动画。','user'],
  ['huashu-art-motion','艺术与视频动画：拆解复刻动画，36 种风格、9 种解说语法。','user'],
  ['office','Create, edit, inspect, or convert Office documents.','bundled'],
  ['office-docx','Create, read, edit, and validate Word documents.','bundled'],
  ['office-export-pdf','Convert an Office document to a requested PDF.','bundled'],
  ['office-pptx','Create, read, edit, and validate PowerPoint decks.','bundled'],
  ['office-recalculate','Refresh spreadsheet formula caches.','bundled'],
  ['office-render','Render document images or inspect visual layout.','bundled'],
  ['office-xlsx','Read, create, edit, and validate Excel workbooks.','bundled'],
  ['diagnose-windows-sandbox-acl','Use on Windows for unexpected DSH sandbox denials.','bundled']
];
const GRP = { project:'项目', user:'用户', bundled:'内置' };
const NUM = { project:9, user:2, bundled:8 };
const list = document.getElementById('list');
let html = '', last = null, i = 0;
for (const [name, desc, src] of DATA) {
  if (src !== last) { html += `<div class="p-grpbar"><span>${GRP[src]}</span><span>${NUM[src]}</span></div>`; last = src; }
  i++;
  const n = String(i).padStart(2,'0');
  html += `<div class="p-row${name==='huashu-design'?' on':''}">
    <div class="p-idx">${n}</div>
    <div class="p-main"><b>${name}</b><p>${desc}</p></div>
    <div class="p-acts"><button class="solid">执行</button><button>插入</button><button>看</button></div>
  </div>`;
}
list.innerHTML = html;
</script>
</body>
</html>
